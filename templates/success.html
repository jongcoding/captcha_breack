<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>성공!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif; background:#0b1220; color:#e8eefc; margin:0}
    .wrap{max-width:720px; margin:40px auto; padding:24px}
    .card{background:#111a2b; border:1px solid #1e2a45; border-radius:16px; padding:24px}
    h1{margin-top:0}
    code{background:#0b1220; padding:8px 10px; border-radius:10px; display:inline-block; border:1px solid #1b2745}
    a.btn{display:inline-block; padding:10px 14px; border-radius:12px; background:#1c2540; color:#fff; text-decoration:none; margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🎉 성공!</h1>
      <p>FLAG:</p>
      <code>{{ flag }}</code>
      <div><a class="btn" href="/">처음으로</a></div>
    </div>
  </div>
</body>
</html>
