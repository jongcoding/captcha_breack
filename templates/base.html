<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reCAPTCHA Demo</title>
  <style>
    body{font-family:ui-sans-serif,system-ui;margin:0;background:#0b1020;color:#e5e7eb}
    .wrap{max-width:880px;margin:28px auto;padding:0 16px}
    a{color:#93c5fd}
    .card{background:#0f1730;border:1px solid #1f2a44;border-radius:14px;padding:16px;margin:14px 0}
    .ok{color:#22c55e}.err{color:#ef4444}.warn{color:#f59e0b}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid #1f2a44;color:#e5e7eb;text-decoration:none}
    .btn:hover{border-color:#60a5fa}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔐 reCAPTCHA v1 / v2 / v3</h1>
    <p>v1은 의도적으로 취약(클라 전용), v2는 체크박스, v3는 점수 기반.</p>
    <div>
      <a class="btn" href="/v1">v1 →</a>
      <a class="btn" href="/v2">v2 →</a>
      <a class="btn" href="/slide-captcha">v3 →</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="card">
          {% for cat, msg in messages %}
            <div class="{{cat}}">{{ msg|safe }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
