{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>v2 — Google reCAPTCHA (Checkbox)</h3>
  <p style="color:#9ca3af">서버에서 <code>/siteverify</code>로 토큰 검증합니다.</p>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <form method="post" action="/v2">
    <input name="email" placeholder="이메일" style="padding:8px;border-radius:8px;border:1px solid #1f2a44;background:#0b1120;color:#e5e7eb">
    <div class="g-recaptcha" data-sitekey="{{ site_key }}" style="margin:10px 0"></div>
    <button type="submit" class="btn">제출</button>
  </form>
</div>
{% endblock %}
